<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;font-family:Jost, sans-serif;color:#2A2622;">
  <a href="MIZU%20Produit.dc.html?id={{ p.qid }}" style="position:relative;display:block;height:{{ h }};border-radius:16px;background:#F3F1EE;overflow:hidden;transition:background-color .3s ease;" style-hover="background:#ECE7E0;">
    <sc-if value="{{ p.noSprite }}" hint-placeholder-val="{{ true }}"><img src="{{ p.img }}" alt="{{ p.name }}" loading="lazy" style="position:absolute;inset:36px;width:calc(100% - 72px);height:calc(100% - 72px);object-fit:contain;mix-blend-mode:multiply;transform:scale({{ p.zoom }});"></sc-if>
    <sc-if value="{{ p.hasSprite }}" hint-placeholder-val="{{ false }}"><div role="img" aria-label="{{ p.name }}" style="position:absolute;top:50%;left:50%;height:calc(100% - 72px);max-width:calc(100% - 72px);aspect-ratio:1;transform:translate(-50%,-50%);background-image:url({{ p.sprite.url }});background-size:{{ p.sprite.size }};background-position:{{ p.sprite.pos }};mix-blend-mode:multiply;"></div></sc-if>
    <span style="position:absolute;top:14px;right:14px;padding:6px 12px;border-radius:999px;background:#FFFFFF;font-size:11px;font-weight:600;letter-spacing:0.08em;">{{ p.brand }}</span>
  </a>
  <h3 style="margin:20px 0 6px;font-size:18px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:47px;">{{ title }}</h3>
  <div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:1.5;color:#6B6258;">
    <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ sub }}</span>
    <span style="color:#8C7B6B;white-space:nowrap;">{{ p.ref }}</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;">
    <a href="MIZU%20Produit.dc.html?id={{ p.qid }}" style="display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:999px;border:1.5px solid #B8986A;font-size:14px;font-weight:500;" style-hover="border-color:#2A2622;color:#2A2622;">Fiche</a>
    <button type="button" onClick="{{ add }}" style="display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:999px;border:0;background:{{ addBg }};color:#FFFFFF;font-family:Jost, sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background-color .25s ease;" style-hover="background:#7D7063;">{{ addLabel }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:500},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;340px&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { added: false };
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const p = this.props.p || {};
    return {
      p,
      title: p.model || p.name,
      sub: p.finish ? p.cat + ' · ' + p.finish : p.cat,
      h: this.props.height ?? '340px',
      addLabel: this.state.added ? 'Ajouté ✓' : '+ Sélection',
      addBg: this.state.added ? '#7D7063' : '#2A2622',
      add: () => {
        if (window.MIZU && p.id) window.MIZU.addSel(p.id);
        this.setState({ added: true });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ added: false }), 1800);
      }
    };
  }
}
</script>
</body>
</html>
